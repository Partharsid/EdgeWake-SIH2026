; EdgeWake - PlatformIO Project Configuration
; Tiered Cascade Guardian System
; Board: AI Thinker ESP32-CAM

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Include paths
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -I include

; Use huge app partition (no OTA) for maximum code space
board_build.partitions = huge_app.csv

; Libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    WiFi
    HTTPClient

; Serial monitor filters
monitor_filters = esp32_exception_decoder
